<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="madarBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="60%" stop-color="#08090d"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <!-- 24K Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="55%" stop-color="#B8861B"/>
      <stop offset="85%" stop-color="#F3D87B"/>
      <stop offset="100%" stop-color="#8A6310"/>
    </linearGradient>

    <!-- Specular Hairline Rim -->
    <linearGradient id="rimSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 242, 178, 0.6)"/>
      <stop offset="50%" stop-color="rgba(212, 175, 55, 0.15)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS Continuous Curvature Squircle Base -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#madarBg)"/>
  
  <!-- Outer Specular Bevel Border -->
  <rect width="509" height="509" x="1.5" y="1.5" rx="115" ry="115" fill="none" stroke="url(#rimSpecular)" stroke-width="2"/>

  <!-- Celestial Grid Latitudes (Subtle Ambient Ring) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(212, 175, 55, 0.12)" stroke-width="1.2" stroke-dasharray="4 6"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Orbital Ring 1: Primary Ellipse -->
  <ellipse cx="256" cy="256" rx="155" ry="80" 
           transform="rotate(-28 256 256)" 
           fill="none" 
           stroke="url(#goldMetallic)" 
           stroke-width="5" 
           filter="url(#goldGlow)"/>

  <!-- Orbital Ring 2: Intersecting Ellipse (The Balance Axis) -->
  <ellipse cx="256" cy="256" rx="145" ry="65" 
           transform="rotate(42 256 256)" 
           fill="none" 
           stroke="url(#goldMetallic)" 
           stroke-width="3" 
           opacity="0.8"/>

  <!-- Central Star & Orbit Node (Celestial Hub) -->
  <circle cx="256" cy="256" r="22" fill="#08090d" stroke="url(#goldMetallic)" stroke-width="4"/>
  <circle cx="256" cy="256" r="10" fill="url(#goldMetallic)"/>

  <!-- Cardinal Ray Accents (North/South Axis) -->
  <line x1="256" y1="110" x2="256" y2="135" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="256" y1="377" x2="256" y2="402" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="110" y1="256" x2="135" y2="256" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="377" y1="256" x2="402" y2="256" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dynamic Orbiting Satellites / Stations -->
  <!-- Station 1 Node: Prayer (Apex) -->
  <circle cx="370" cy="195" r="7" fill="#ffffff" filter="url(#goldGlow)"/>
  <!-- Station 2 Node: Work (East) -->
  <circle cx="160" cy="210" r="5.5" fill="url(#goldMetallic)"/>
  <!-- Station 3 Node: Health (South) -->
  <circle cx="340" cy="330" r="6" fill="#30D158"/>

  <!-- Inner Ambient Starlight Glow -->
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>
</svg>
